# Alembic — baza sxemasi migratsiyalari.
# Ishga tushirish (D:\KP_AGENT\backend papkasidan):
#   ..\.venv\Scripts\alembic.exe upgrade head
# Ulanish ma'lumotlari ..\.env dagi DB_OWNER_* dan olinadi (bu faylda parol yo'q).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
